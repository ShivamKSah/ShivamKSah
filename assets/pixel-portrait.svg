<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" role="img" aria-labelledby="title desc">
  <title id="title">Shivam Kumar Sah, pixel portrait</title>
  <desc id="desc">A warm green and amber dot-matrix portrait rendered in a terminal style.</desc>
  <defs>
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="1.8" fill="currentColor"/>
    </pattern>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39d353"/>
      <stop offset="0.55" stop-color="#168f48"/>
      <stop offset="1" stop-color="#0b4d36"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="0.5" stop-color="#f59e42"/>
      <stop offset="1" stop-color="#d85c38"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b6ca8"/>
      <stop offset="1" stop-color="#17345f"/>
    </linearGradient>
    <clipPath id="portrait">
      <path d="M62 325c5-62 32-92 76-108-18-21-25-48-20-78 6-43 38-73 83-73s78 30 84 73c5 30-2 57-20 78 45 16 71 46 76 108z"/>
    </clipPath>
  </defs>

  <rect width="360" height="360" rx="12" fill="#0d1117"/>
  <g clip-path="url(#portrait)">
    <rect x="45" y="45" width="270" height="285" fill="url(#dots)" style="color:#123b35"/>
    <path d="M50 210c6-80 24-145 75-158 44-12 114-3 142 40 20 30 22 77 13 120l-29-25-7-87-23-27-82 4-31 38-12 77z" fill="url(#hair)"/>
    <path d="M119 108c14-35 43-50 78-46 42 5 62 35 61 78-1 47-24 83-59 91-35 8-70-15-82-55-8-27-7-48 2-68z" fill="url(#skin)"/>
    <path d="M123 112c20-45 55-58 91-45l28 30-13 27-14-24-27 11-49-4-15 30z" fill="url(#hair)"/>
    <path d="M151 145h30l-5 8h-26zM207 145h29l1 8h-30z" fill="#321d2a"/>
    <path d="M163 181c17 12 35 12 53 0" fill="none" stroke="#71342f" stroke-width="5"/>
    <path d="M181 151l-5 28 13 4" fill="none" stroke="#c75334" stroke-width="4"/>
    <path d="M66 331c6-65 35-101 86-113 28 21 55 27 83 0 51 12 80 48 87 113z" fill="url(#shirt)"/>
    <path d="M151 216c16 27 55 31 73 0l20 13c-24 44-72 52-113 0z" fill="#f3ad4b"/>
    <rect x="55" y="55" width="255" height="280" fill="url(#dots)" style="color:#f6b447" opacity=".42"/>
  </g>
  <path d="M61 325h238" stroke="#39d353" stroke-width="2" opacity=".7"/>
  <circle cx="314" cy="44" r="3" fill="#39d353"/>
  <circle cx="326" cy="44" r="3" fill="#f59e42"/>
</svg>
